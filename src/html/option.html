<div class="animate__animated">
    <button id="backButton" class="absolute top-3 left-3 flex items-center justify-center">
        <span class="material-icons text-white mr-2" style="font-size: 16px;">
            arrow_back
        </span>
        <a class="text-white font-semibold">Volver</a>
    </button>

    <h1 class="font-bold mt-16 text-xl">PREGUNTA</h1>
    <div>
        <div class="flex justify-evenly mt-6">
            <div id="studentDiv" class="animate__animated">
                <input type="checkbox" id="student" name="student" class="hidden" />
                <label for="student" class="relative cursor-pointer">
                    <div
                        class="w-24 h-24 flex bg-[#E1E1E1] items-center justify-center rounded-full transition duration-300 ease-in-out transform hover:scale-105">
                        <img src="../img/studentOption.png" alt="student" class="w-20 h-20 mt-4" />
                        <div
                            class="absolute inset-0 rounded-full ring ring-yellow-400 opacity-0 transition-opacity duration-300 ease-in-out pointer-events-none">
                        </div>
                    </div>
                </label>
                <h1 class="mt-1 font-semibold">Estudiante</h1>
            </div>

            <div id="teacherDiv" class="animate__animated">
                <input type="checkbox" id="teacher" name="teacher" class="hidden" />
                <label for="teacher" class="relative cursor-pointer">
                    <div
                        class="w-24 h-24 flex bg-[#E1E1E1] items-center justify-center rounded-full transition duration-300 ease-in-out transform hover:scale-105">
                        <img src="../img/teacherOption.png" alt="teacher" class="w-[72px] h-[72px] mt-2" />
                        <div
                            class="absolute inset-0 rounded-full ring ring-yellow-400 opacity-0 transition-opacity duration-300 ease-in-out pointer-events-none">
                        </div>
                    </div>
                </label>

                <h1 class="mt-1 font-semibold">Docente</h1>
            </div>
        </div>

        <div class="flex items-center justify-center mt-8">
            <div class="flex items-start flex-col justify-center w-80 relative">
                <label class="block text-sm font-semibold text-white">Nombre de usuario</label>
                <input type="text" id="usernameInput" name="username"
                    class="mt-1 p-2 pl-10 border rounded-full w-full text-black font-semibold focus:ring-yellow-400 focus:ring-2"></input>
                <span class="material-icons absolute top-8 left-3 text-[#167563]">
                    person
                </span>
            </div>
        </div>



    </div>


</div>
<div class="flex-1 h-1/2 items-center flex justify-center">
    <button id="loginButton"
        class="disabled:pointer-events-none disabled:bg-gray-300 flex items-center justify-center bg-white text-lg lg:text-xl md:text-md font-bold rounded-full shadow-lg px-16 lg:px-20 py-3 lg:py-4 text-gray-800 transition-transform hover:scale-105 hover:shadow-xl relative"
        disabled>
        <i class="fas fa-lock right-5 absolute" style="transform: rotateY(0deg); transition: transform 0.3s;"></i>
        Entrar
        al mundo
    </button>
</div>



<style>
    #student:checked+label>div>div {
        opacity: 1;
    }

    #teacher:checked+label>div>div {
        opacity: 1;
    }
</style>
